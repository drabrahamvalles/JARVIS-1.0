apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: jarvis
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/maxScale: '20'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/execution-environment: gen1
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: '<CUENTA_DE_SERVICIO>'
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: '<IMAGEN>'
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 240
            timeoutSeconds: 240
            failureThreshold: 1
          env:
            - name: HOST
              value: 0.0.0.0
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: OPENAI_API_KEY
                  key: latest
            - name: JARVIS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: JARVIS_TOKEN
                  key: latest
  traffic:
    - latestRevision: true
      percent: 100
